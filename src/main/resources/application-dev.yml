spring:
  r2dbc:
    url: r2dbc:mysql://localhost:3306/adm_video
    username: root
    password: root
    pool:
      enabled: true
      initial-size: 5
      max-size: 10

  flyway:
    url: jdbc:mysql://localhost:3306/adm_video
    user: root
    password: root
    locations: classpath:db/migration
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.data.r2dbc: DEBUG

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

